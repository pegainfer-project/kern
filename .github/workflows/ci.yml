name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build documentation
        working-directory: docs
        run: npm run build

  manifest:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: |
          cargo fmt --check
          rustfmt --check --edition 2021 crates/kern-serve/src/lib.rs crates/kern-serve/src/main.rs

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Clippy
        # kern-serve builds only in the kernel-lab container; every other crate
        # compiles here, cudarc loads libcuda at run time.
        run: cargo clippy -p kern-manifest -p kern-runtime -p kern-run --all-targets -- -D warnings

      - name: Test
        # The runtime's tests are host-side (Pool, Prefix, Host, values); the
        # GPU gate is `kern test`.
        run: cargo test -p kern-manifest -p kern-runtime

      - name: Performance evidence regression tests
        run: python3 -m unittest discover -s tools -p test_profile.py

      - name: Qwen constant migration regression tests
        run: python3 -m unittest discover -s tools -p test_qwen_constants.py

      - name: TRTLLM manifest conversion regression tests
        run: python3 -m unittest discover -s tools -p test_trtllm_manifest.py

      - name: Protocol names stay in the manifest
        run: |
          # kern-run and kern-serve drive the runtime through `Protocol`; a
          # fill, program, var or buffer name in their non-test code is the
          # serving contract leaking out of the manifest. Test fixtures
          # (everything from `#[cfg(test)]` on) may spell names out.
          names='"(token|position|slot|seq_len|cu_seqlens|span_at|count|error|prefill|decode|decode_batch|decode_span|round|seqs|span|token_ids|next_token|slot_mapping|seq_lens|positions|block_table|cu_seqlens_q|tp_err|nacc|anchor_token|verify_tokens|draft_tokens|line_index)"'
          bad=0
          for f in $(find crates/kern-serve/src crates/kern-run/src -name '*.rs' | sort); do
            if sed '/#\[cfg(test)\]/,$d' "$f" | grep -nE "$names" | sed "s|^|$f:|" | grep .; then bad=1; fi
          done
          if [ "$bad" != 0 ]; then
            echo "::error::a manifest name is spelled out in serving code; read it off Protocol instead"
            exit 1
          fi

      - name: Schema golden check
        run: |
          cargo run -q -p kern-manifest --example gen_schema > /tmp/manifest-v5.schema.json
          if ! diff -u schema/manifest-v5.schema.json /tmp/manifest-v5.schema.json; then
            echo "::error::schema/manifest-v5.schema.json is stale — regenerate with: cargo run -p kern-manifest --example gen_schema > schema/manifest-v5.schema.json"
            exit 1
          fi

  hawk:
    # Workspace-wide visibility lint. Only `unnecessary_restricted_visibility`
    # is enforced: kern-serve lives outside this workspace and is the main
    # consumer of the runtime's public API, so hawk's closed world would call
    # that API dead. A `pub(crate)` cannot cross a crate boundary, so that
    # class is exact. The other two lints are an audit tool; see the
    # `hawk` skill. Hawk is built against one exact rustc; bump both together.
    runs-on: ubuntu-latest
    env:
      HAWK_VERSION: "0.1.14"
      HAWK_RUST: "1.98.1"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install cargo-hawk
        run: |
          set -euo pipefail
          base="https://github.com/astral-sh/hawk/releases/download/$HAWK_VERSION"
          curl -fsSL "$base/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz" -o hawk.tar.gz
          curl -fsSL "$base/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz.sha256" -o hawk.sha256
          echo "$(cut -d' ' -f1 hawk.sha256)  hawk.tar.gz" | sha256sum -c
          tar -xzf hawk.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" \
            --wildcards "*/cargo-hawk" "*/cargo-hawk-driver"
          cargo hawk --version

      - name: Restricted visibility is the tightest that compiles
        run: |
          cargo +"$HAWK_RUST" hawk check --color always \
            -A hawk::dead_public -A hawk::unnecessary_public \
            -D hawk::unnecessary_restricted_visibility
