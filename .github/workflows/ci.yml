name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build documentation
        working-directory: docs
        run: npm run build

  manifest:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        # Both workspaces: `cargo fmt` walks the one it runs in, and kern-serve
        # is a workspace of its own.
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path crates/kern-serve/Cargo.toml

      - name: One version for both binaries
        # kern-serve cannot inherit `[workspace.package]` any more, so this is
        # what keeps the two in step; a release tag is compared against the
        # runtime's version alone.
        run: |
          set -euo pipefail
          root=$(cargo pkgid -p kern-run | sed 's/.*[@#]//')
          serve=$(cargo metadata --no-deps --format-version 1 --manifest-path crates/kern-serve/Cargo.toml \
                  | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$root" != "$serve" ]; then
            echo "::error::kern is $root and kern-serve is $serve; one release tags both"
            exit 1
          fi

      - name: The runtime resolves without a git source
        # The serving stack's pinned git dependencies live in its own
        # workspace; a git source here would make every build of the runtime
        # fetch them.
        run: |
          if grep -q 'source = "git+' Cargo.lock; then
            echo "::error::Cargo.lock names a git source; the runtime resolves against crates.io alone"
            exit 1
          fi

      - name: Both workspaces resolve the runtime at the same versions
        # Two locks, one runtime: a dependency bumped in one of them alone
        # would give the two binaries of a release different versions of the
        # same crate, which the runtime id cannot see.
        run: cargo test -p kern-run --test locks

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Clippy
        # The runtime's default members: they compile anywhere, cudarc loads
        # libcuda at run time. kern-serve is its own workspace and needs protoc
        # and libssl-dev; the serve job builds and tests it.
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # The runtime's tests are host-side (Pool, Prefix, Host, values, the
        # launcher's handover to kern-serve); the tests that want a GPU are
        # `#[ignore]`d and the GPU gate is `kern test`.
        run: cargo test -p kern-manifest -p kern-pool -p kern-runtime -p kern-test -p kern-run

      - name: The runtime id follows every compile input
        # A digest that skipped a file would wave a stale binary through, so
        # change a PTX the runtime compiles in and check that the id moves —
        # and that it comes back once the file does.
        run: |
          set -euo pipefail
          id() { cargo run -q -p kern-run --bin kern -- --version | sed 's/.*runtime //'; }
          ptx=crates/kern-runtime/src/profile.ptx
          mkdir -p target
          cp "$ptx" target/profile.ptx.bak
          before=$(id)
          printf '\n// id probe\n' >>"$ptx"
          after=$(id)
          mv target/profile.ptx.bak "$ptx"
          if [ "$before" = "$after" ]; then
            echo "::error::$ptx is not part of the runtime id"
            exit 1
          fi
          if [ "$before" != "$(id)" ]; then
            echo "::error::the runtime id did not come back after restoring $ptx"
            exit 1
          fi

      - name: Performance evidence regression tests
        run: python3 -m unittest discover -s tools -p test_profile.py

      - name: Qwen constant migration regression tests
        run: python3 -m unittest discover -s tools -p test_qwen_constants.py

      - name: Kernel index tooling
        run: python3 -m unittest discover -s tools/kernels -p test_index.py

      - name: TRTLLM manifest conversion regression tests
        run: python3 -m unittest discover -s tools -p test_trtllm_manifest.py

      - name: e2e driver verdicts
        run: python3 -m unittest discover -s tools/e2e -p test_e2e.py

      - name: Protocol names stay in the manifest
        run: |
          # kern-run, kern-test and kern-serve drive the runtime through `Protocol`; a
          # fill, program, var or buffer name in their non-test code is the
          # serving contract leaking out of the manifest. Test fixtures
          # (everything from `#[cfg(test)]` on) may spell names out.
          names='"(token|position|slot|seq_len|cu_seqlens|span_at|count|error|prefill|decode|decode_batch|decode_span|round|seqs|span|token_ids|next_token|slot_mapping|seq_lens|positions|block_table|cu_seqlens_q|tp_err|nacc|anchor_token|verify_tokens|draft_tokens|line_index)"'
          bad=0
          for f in $(find crates/kern-serve/src crates/kern-run/src crates/kern-test/src -name '*.rs' | sort); do
            if sed '/#\[cfg(test)\]/,$d' "$f" | grep -nE "$names" | sed "s|^|$f:|" | grep .; then bad=1; fi
          done
          if [ "$bad" != 0 ]; then
            echo "::error::a manifest name is spelled out in serving code; read it off Protocol instead"
            exit 1
          fi

      - name: Schema golden check
        run: |
          cargo run -q -p kern-manifest --example gen_schema > /tmp/manifest-v5.schema.json
          if ! diff -u schema/manifest-v5.schema.json /tmp/manifest-v5.schema.json; then
            echo "::error::schema/manifest-v5.schema.json is stale — regenerate with: cargo run -p kern-manifest --example gen_schema > schema/manifest-v5.schema.json"
            exit 1
          fi

  hawk:
    # Workspace-wide visibility lint. Only `unnecessary_restricted_visibility`
    # is enforced: a `pub(crate)` cannot cross a crate boundary, so that class
    # is exact. `dead_public` and `unnecessary_public` stay an audit tool until
    # the public surface is trimmed; see the `hawk` skill. Hawk is built
    # against one exact rustc; bump both together. Hawk compiles a whole
    # workspace, so it runs once for the runtime's and once for kern-serve's,
    # which is why the job needs the serving stack's build dependencies and
    # keeps one target directory between runs.
    runs-on: ubuntu-latest
    env:
      HAWK_VERSION: "0.1.14"
      HAWK_RUST: "1.98.1"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/hawk"
          key: hawk-${{ env.HAWK_VERSION }}

      - name: Install cargo-hawk
        run: |
          set -euo pipefail
          base="https://github.com/astral-sh/hawk/releases/download/$HAWK_VERSION"
          curl -fsSL "$base/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz" -o hawk.tar.gz
          curl -fsSL "$base/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz.sha256" -o hawk.sha256
          echo "$(cut -d' ' -f1 hawk.sha256)  hawk.tar.gz" | sha256sum -c
          tar -xzf hawk.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" \
            --wildcards "*/cargo-hawk" "*/cargo-hawk-driver"
          cargo hawk --version

      - name: Restricted visibility is the tightest that compiles
        run: |
          cargo +"$HAWK_RUST" hawk check --color always --target-dir target/hawk \
            -A hawk::dead_public -A hawk::unnecessary_public \
            -D hawk::unnecessary_restricted_visibility
          ( cd crates/kern-serve
            cargo +"$HAWK_RUST" hawk check --color always --target-dir ../../target/hawk \
              -A hawk::dead_public -A hawk::unnecessary_public \
              -D hawk::unnecessary_restricted_visibility )

  serve:
    # kern-serve is a workspace of its own, and its tests are about the two
    # contracts that only appear at the boundary: the renderers against vLLM's
    # own chat renderers, and the handover `kern server` makes to a server it
    # did not build. Both need the serving stack's build dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Test
        run: cargo test --locked --manifest-path crates/kern-serve/Cargo.toml
