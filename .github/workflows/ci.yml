name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

# Every Rust job builds the workspace but kern-py (a Python extension, built
# by maturin in the release pipeline), kern-serve included, so each installs
# protoc and OpenSSL. Rust caches are written from master only: a PR reads
# master's and never pushes a copy of its own into the 10 GB repository cap.

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build documentation
        working-directory: docs
        run: npm run build

  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Performance evidence regression tests
        run: python3 -m unittest discover -s tools -p test_profile.py

      - name: Qwen constant migration regression tests
        run: python3 -m unittest discover -s tools -p test_qwen_constants.py

      - name: Kernel index tooling
        run: python3 -m unittest discover -s tools/kernels -p test_index.py

      - name: Kernel index
        run: python3 tools/kernels/check.py

      - name: TRTLLM manifest conversion regression tests
        run: python3 -m unittest discover -s tools -p test_trtllm_manifest.py

      - name: e2e driver verdicts
        run: python3 -m unittest discover -s tools/e2e -p test_e2e.py

      - name: toy reference
        run: python3 -m unittest discover -s tools/toy -p test_model.py

      - name: Protocol names stay in the manifest
        run: |
          # kern-run, kern-test and kern-serve drive the runtime through `Protocol`; a
          # fill, program, var or buffer name in their non-test code is the
          # serving contract leaking out of the manifest. Test fixtures
          # (everything from `#[cfg(test)]` on) may spell names out.
          names='"(token|position|slot|seq_len|cu_seqlens|count|error|prefill|decode|decode_batch|round|seqs|token_ids|next_token|slot_mapping|seq_lens|positions|block_table|cu_seqlens_q|tp_err|nacc|anchor_token|verify_tokens|draft_tokens|line_index)"'
          bad=0
          for f in $(find crates/kern-serve/src crates/kern-run/src crates/kern-test/src -name '*.rs' | sort); do
            if sed '/#\[cfg(test)\]/,$d' "$f" | grep -nE "$names" | sed "s|^|$f:|" | grep .; then bad=1; fi
          done
          if [ "$bad" != 0 ]; then
            echo "::error::a manifest name is spelled out in serving code; read it off Protocol instead"
            exit 1
          fi

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Clippy
        run: cargo clippy --workspace --exclude kern-py --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Test
        # Host-side only: tests that need a GPU are `#[ignore]`d, and the GPU
        # gate is `kern test`.
        run: cargo test --workspace --exclude kern-py --locked

      - name: Schema golden check
        run: |
          cargo run -q -p kern-manifest --example gen_schema > /tmp/manifest-v7.schema.json
          if ! diff -u schema/manifest-v7.schema.json /tmp/manifest-v7.schema.json; then
            echo "::error::schema/manifest-v7.schema.json is stale — regenerate with: cargo run -p kern-manifest --example gen_schema > schema/manifest-v7.schema.json"
            exit 1
          fi

  hawk:
    # Workspace-wide visibility lint. Only `unnecessary_restricted_visibility`
    # is enforced: a `pub(crate)` cannot cross a crate boundary, so that class
    # is exact. `dead_public` and `unnecessary_public` stay an audit tool until
    # the public surface is trimmed; see Gates in AGENTS.md. Hawk is built
    # against one exact rustc; bump both together.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAWK_VERSION: "0.1.14"
      HAWK_RUST: "1.98.1"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/hawk"
          key: hawk-${{ env.HAWK_VERSION }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cargo-hawk
        run: |
          set -euo pipefail
          base="https://github.com/astral-sh/hawk/releases/download/$HAWK_VERSION"
          curl -fsSL "$base/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz" -o hawk.tar.gz
          curl -fsSL "$base/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz.sha256" -o hawk.sha256
          echo "$(cut -d' ' -f1 hawk.sha256)  hawk.tar.gz" | sha256sum -c
          tar -xzf hawk.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" \
            --wildcards "*/cargo-hawk" "*/cargo-hawk-driver"
          cargo hawk --version

      - name: Restricted visibility is the tightest that compiles
        # Hawk's check and its doctest pass disagree on RUSTC_BOOTSTRAP, which
        # build scripts such as proc-macro2's track, so each pass dirtied the
        # other's whole dependency tree and the cache never held. Pinning it
        # leaves only the workspace crates to recheck.
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          cargo +"$HAWK_RUST" hawk check --color always --target-dir target/hawk \
            -A hawk::dead_public -A hawk::unnecessary_public \
            -D hawk::unnecessary_restricted_visibility
