name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "docs/.vitepress/**"
      - "docs/site/**"
      - "docs/README.md"
      - "docs/package.json"
      - "docs/package-lock.json"
      - "schema/**"
      - "examples/minimal.json"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-kern-website
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            docs/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Install documentation dependencies
        run: npm --prefix ../docs ci

      - name: Build
        run: npm run build

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_TOKEN" ]; then
            echo "::error::Grant CLOUDFLARE_API_TOKEN or CF_API_TOKEN to this repository."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_ACCOUNT_ID repository variable."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          wranglerVersion: "4.127.1"
          command: >-
            pages deploy dist
            --project-name=kern
            --branch=master
            --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
