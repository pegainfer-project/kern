[workspace]
resolver = "2"
# kern-serve is not a member: resolving its pinned git dependencies would make
# every build of this workspace fetch them. It is its own workspace in
# `crates/kern-serve/`.
members = [
    "crates/kern-manifest",
    "crates/kern-pool",
    "crates/kern-runtime",
    "crates/kern-test",
    "crates/kern-run",
    "crates/kern-py",
    "tools/dsv41/attention/ar_trace",
    "tools/dsv41/moe/runtime_replay",
]
# A bare `cargo build` / `test` / `clippy` is the runtime: the dsv41 harnesses
# need a GPU and kern-py is a Python extension, built by maturin where a Python
# is, so both are built by name.
default-members = ["crates/kern-manifest", "crates/kern-pool", "crates/kern-runtime", "crates/kern-test", "crates/kern-run"]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
kern-manifest = { path = "crates/kern-manifest" }
kern-pool = { path = "crates/kern-pool" }
kern-runtime = { path = "crates/kern-runtime" }
kern-test = { path = "crates/kern-test" }
kern-run = { path = "crates/kern-run" }

anyhow = "1"
# Recorded references are ragged tables (a row per token position, list
# columns for the top-k), which parquet holds and pandas / duckdb read as is.
arrow-array = "=60.0.0"
arrow-schema = "=60.0.0"
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "snap"] }
clap = { version = "4", features = ["derive"] }
# The CUDA API kern binds is a fact about the binary, not about the build
# machine: `cuda-13000` pins it, and no toolkit is needed to build.
cudarc = { version = "=0.19.7", features = ["cuda-13000", "f16", "nccl"] }
half = "=2.7.1"
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
schemars = "1"
serde = { version = "1", features = ["derive"] }
safetensors = "=0.8.0"
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokenizers = "=0.23.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"

[workspace.lints.clippy]
disallowed_types = "deny"  # clippy.toml: std hash maps, whose iteration order is random per process
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"
needless_range_loop = "allow"
