[workspace]
members = ["crates/kern-manifest", "crates/kern-runtime", "crates/kern-run"]
# kern-serve is its own workspace: it pulls the pegainfer/vLLM serving stack,
# which the runtime and its CI never need.
exclude = ["crates/kern-serve"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
kern-manifest = { path = "crates/kern-manifest" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The CUDA API kern binds is a fact about the binary, not about the build
# machine: `cuda-13000` pins it, and no toolkit is needed to build.
cudarc = { version = "=0.19.7", features = ["cuda-13000", "f16"] }
half = "=2.7.1"
safetensors = "=0.7.0"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
thiserror = "2"
libc = "0.2"
tokenizers = "=0.22.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "2"

[workspace.lints.clippy]
disallowed_types = "deny"  # clippy.toml: std hash maps, whose iteration order is random per process
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"
needless_range_loop = "allow"
