[workspace]
resolver = "2"
members = [
    "crates/kern-manifest",
    "crates/kern-pool",
    "crates/kern-runtime",
    "crates/kern-test",
    "crates/kern-run",
    "crates/kern-serve",
    "crates/kern-py",
]
# A bare `cargo build` / `test` / `clippy` is the runtime and `kern`, whose
# e2e_logits renders chats through vLLM's renderers (libssl). kern-serve pulls
# the rest of the pegainfer/vLLM serving stack (protoc, ~500 crates), so it is
# built by name. kern-py is a Python extension, built by maturin where a Python
# is.
default-members = ["crates/kern-manifest", "crates/kern-pool", "crates/kern-runtime", "crates/kern-test", "crates/kern-run"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
kern-manifest = { path = "crates/kern-manifest" }
kern-pool = { path = "crates/kern-pool" }
kern-runtime = { path = "crates/kern-runtime" }
kern-test = { path = "crates/kern-test" }
kern-run = { path = "crates/kern-run" }

# The serving frontend (infront: the scheduler contract and vLLM's Rust
# frontend behind it), pinned to a main commit and bumped deliberately. Its
# vLLM crates carry the chat renderers, picked by the checkpoint's
# model_type. `vllm-chat`, `vllm-text` and `vllm-tokenizer` (its test
# tokenizer) are the vLLM rev infront pins, so the renderer tests read the
# crate the server runs.
infront-engine = { git = "https://github.com/pegainfer-project/infront", rev = "4fa55c7b8169bc931b197fd079ec2b8228a5ee03" }
infront-vllm = { git = "https://github.com/pegainfer-project/infront", rev = "4fa55c7b8169bc931b197fd079ec2b8228a5ee03" }
vllm-chat = { git = "https://github.com/vllm-project/vllm.git", rev = "08b989da99f0c0c76520a47580de9c18137500c9" }
vllm-tokenizer = { git = "https://github.com/vllm-project/vllm.git", rev = "08b989da99f0c0c76520a47580de9c18137500c9" }
vllm-text = { git = "https://github.com/vllm-project/vllm.git", rev = "08b989da99f0c0c76520a47580de9c18137500c9" }

anyhow = "1"
# The frontend's own HTTP stack; kern-serve puts its refusals in front of it.
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
# Recordings are ragged tables (a row per conversation, list columns for its
# tokens and per-position top-k), which parquet holds and pandas / duckdb read
# as is.
arrow-array = "=60.0.0"
arrow-schema = "=60.0.0"
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "snap"] }
clap = { version = "4", features = ["derive"] }
# The CUDA API kern binds is a fact about the binary, not about the build
# machine: `cuda-13000` pins it, and no toolkit is needed to build.
cudarc = { version = "=0.19.7", features = ["cuda-13000", "f16", "nccl"] }
half = "=2.7.1"
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
schemars = "1"
serde = { version = "1", features = ["derive"] }
safetensors = "=0.8.0"
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokenizers = "=0.23.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"

[workspace.lints.clippy]
disallowed_types = "deny"  # clippy.toml: std hash maps, whose iteration order is random per process
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"
needless_range_loop = "allow"
