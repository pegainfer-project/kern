[workspace]
resolver = "2"
members = [
    "crates/kern-manifest",
    "crates/kern-pool",
    "crates/kern-runtime",
    "crates/kern-test",
    "crates/kern-run",
    "crates/kern-serve",
    "tools/dsv41/attention/ar_trace",
    "tools/dsv41/moe/runtime_replay",
]
# A bare `cargo build` / `test` / `clippy` is the runtime: kern-serve pulls the
# pegainfer/vLLM serving stack (protoc, libssl, ~500 crates) and the dsv41
# harnesses need a GPU, so both are built by name.
default-members = ["crates/kern-manifest", "crates/kern-pool", "crates/kern-runtime", "crates/kern-test", "crates/kern-run"]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
kern-manifest = { path = "crates/kern-manifest" }
kern-pool = { path = "crates/kern-pool" }
kern-runtime = { path = "crates/kern-runtime" }
kern-test = { path = "crates/kern-test" }
kern-run = { path = "crates/kern-run" }

# Pinned to a pegainfer main commit; bump deliberately. Its vLLM crates carry
# the chat renderers, picked by the checkpoint's model_type. `vllm-chat` is the
# same vLLM rev pegainfer pins, so the renderer tests read the crate the
# server runs.
pegainfer-frontend = { git = "https://github.com/pegainfer-project/pegainfer", rev = "139d925e8693dcff412b8501f8db09eb639d0ffd" }
vllm-chat = { git = "https://github.com/vllm-project/vllm.git", rev = "89dbb2644552d6e473a7e97da0ce8f0aa8e32c9d" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The CUDA API kern binds is a fact about the binary, not about the build
# machine: `cuda-13000` pins it, and no toolkit is needed to build.
cudarc = { version = "=0.19.7", features = ["cuda-13000", "f16", "nccl"] }
half = "=2.7.1"
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
schemars = "1"
serde = { version = "1", features = ["derive"] }
safetensors = "=0.8.0"
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokenizers = "=0.23.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"

[workspace.lints.clippy]
disallowed_types = "deny"  # clippy.toml: std hash maps, whose iteration order is random per process
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"
needless_range_loop = "allow"
