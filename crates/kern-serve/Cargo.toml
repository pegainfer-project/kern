[package]
name = "kern-serve"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
description = "OpenAI-compatible serving over a kern manifest: a continuous-batching scheduler behind the pegainfer frontend"

# Its own workspace, on purpose: the serving stack (pegainfer frontend, vLLM
# Rust server crates) stays out of the runtime's dependency graph and CI.
[workspace]
[workspace.lints.clippy]
disallowed_types = "deny"  # clippy.toml: std hash maps, whose iteration order is random per process
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"
needless_range_loop = "allow"

[lints]
workspace = true

[dependencies]
kern-manifest = { path = "../kern-manifest" }
kern-runtime = { path = "../kern-runtime" }
kern-run = { path = "../kern-run" }
# Pinned to a pegainfer main commit; bump deliberately. Its vLLM crates carry
# the chat renderers, picked by the checkpoint's model_type.
pegainfer-frontend = { git = "https://github.com/pegainfer-project/pegainfer", rev = "a30543d10c21b713895ec317366729c9cd12cea3" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Weights are mapped, not read: a tray's ranks share the page cache and
# no rank holds a copy of its shard in DRAM.
memmap2 = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "kern-serve"
path = "src/main.rs"

[dev-dependencies]
# The same vLLM rev pegainfer pins, so the renderer tests read the crate the server runs.
vllm-chat = { git = "https://github.com/vllm-project/vllm.git", rev = "6ff479e1f798048829f884b4229f28c9b9b0c8d7" }
