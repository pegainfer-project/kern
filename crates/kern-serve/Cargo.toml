[package]
name = "kern-serve"
# The runtime's version: one release tag names both binaries, and CI fails when
# the two drift.
version = "0.2.3"
edition = "2021"
license = "Apache-2.0"

# A workspace of its own: as a member of the root workspace, resolving the git
# dependencies below cost every build of the runtime a fetch of pegainfer, its
# submodules and vLLM.
[workspace]

[dependencies]
kern-manifest = { path = "../kern-manifest" }
kern-pool = { path = "../kern-pool" }
kern-runtime = { path = "../kern-runtime" }
kern-run = { path = "../kern-run" }

# Pinned to a pegainfer main commit; bump deliberately. Its vLLM crates carry
# the chat renderers, picked by the checkpoint's model_type. `vllm-chat` is the
# same vLLM rev pegainfer pins, so the renderer tests read the crate the
# server runs.
pegainfer-frontend = { git = "https://github.com/pegainfer-project/pegainfer", rev = "139d925e8693dcff412b8501f8db09eb639d0ffd" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
vllm-chat = { git = "https://github.com/vllm-project/vllm.git", rev = "89dbb2644552d6e473a7e97da0ce8f0aa8e32c9d" }

[lints.clippy]
disallowed_types = "deny"  # clippy.toml: std hash maps, whose iteration order is random per process
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"
needless_range_loop = "allow"
