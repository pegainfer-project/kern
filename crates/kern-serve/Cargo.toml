[package]
name = "kern-serve"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "OpenAI-compatible serving over a kern manifest: a continuous-batching scheduler behind the pegainfer frontend"

# Its own workspace, on purpose: the serving stack (pegainfer frontend, vLLM
# Rust server crates) stays out of the runtime's dependency graph and CI.
[workspace]
exclude = ["vendor/pegainfer-frontend", "vendor/vllm-chat"]
[workspace.lints.clippy]
disallowed_types = "deny"  # clippy.toml: std hash maps, whose iteration order is random per process
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"
needless_range_loop = "allow"

[lints]
workspace = true

[dependencies]
kern-manifest = { path = "../kern-manifest" }
kern-runtime = { path = "../kern-runtime" }
kern-run = { path = "../kern-run" }
# Pinned source plus the renderer configuration seam; see vendor/.../UPSTREAM.md.
pegainfer-frontend = { path = "vendor/pegainfer-frontend" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Weights are mapped, not read: a tray's ranks share the page cache and
# no rank holds a copy of its shard in DRAM.
memmap2 = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "kern-serve"
path = "src/main.rs"

[dev-dependencies]
vllm-chat = { git = "https://github.com/vllm-project/vllm.git", rev = "d3e2888c7588fe3a7be93606c7c626dbfd304d2e" }

[patch."https://github.com/vllm-project/vllm.git"]
vllm-chat = { path = "vendor/vllm-chat" }
