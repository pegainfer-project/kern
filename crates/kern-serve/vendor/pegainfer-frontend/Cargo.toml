[package]
edition = "2024"
license = "Apache-2.0"
name = "pegainfer-frontend"
version = "0.1.0"

[workspace]

[dependencies]
anyhow = { version = "1.0" }
axum = { version = "0.8" }
clap = { version = "4.6.1", features = ["derive"] }
crossbeam-channel = { version = "0.5" }
fastrace = { version = "0.7.17", features = ["enable"] }
log = { version = "0.4" }
rmp-serde = { version = "1.3" }
rmpv = { version = "1.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.149" }
thiserror = { version = "2.0.17" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde", "v4"] }
vllm-engine-core-client = { git = "https://github.com/vllm-project/vllm.git", rev = "d3e2888c7588fe3a7be93606c7c626dbfd304d2e" }
vllm-server = { git = "https://github.com/vllm-project/vllm.git", rev = "d3e2888c7588fe3a7be93606c7c626dbfd304d2e" }
zeromq = { version = "0.6.0", default-features = false, features = ["tokio-runtime", "all-transport"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros", "rt"] }
