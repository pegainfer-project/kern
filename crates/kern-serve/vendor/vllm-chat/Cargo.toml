[package]
name = "vllm-chat"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
anyhow = { version = "1.0.100" }
asynk-strim-attr = { version = "0.1.0" }
easy-ext = { version = "1.0.3" }
futures = { version = "0.3.31" }
half = { version = "2.7.1", features = ["bytemuck"] }
itertools = { version = "0.14.0" }
llm-multimodal = { git = "https://github.com/smg-project/llm-multimodal", rev = "15adba5e025d8636ba4a334fb379b1371f6196a1", default-features = false, features = ["native-tls"] }
minijinja = { version = "2.24", features = ["unstable_machinery", "json", "builtins", "loader", "loop_controls", "preserve_order"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
openai-harmony = { package = "oss-harmony", git = "https://github.com/oss-harmony/harmony", tag = "v0.0.11", default-features = false }
reqwest-0-13 = { package = "reqwest", version = "0.13.4", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-json-fmt = { version = "0.1.0" }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_with = { version = "3.18.0" }
strum = { version = "0.27.2", features = ["derive"] }
subenum = { version = "1.1.3" }
thiserror = { version = "2.0.16" }
thiserror-ext = { version = "0.3.0" }
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
trait-set = { version = "0.3.0" }
uuid = { version = "1.22.0", features = ["v4"] }
vllm-engine-core-client = { git = "https://github.com/vllm-project/vllm.git", rev = "d3e2888c7588fe3a7be93606c7c626dbfd304d2e" }
vllm-llm = { git = "https://github.com/vllm-project/vllm.git", rev = "d3e2888c7588fe3a7be93606c7c626dbfd304d2e" }
vllm-parser = { git = "https://github.com/vllm-project/vllm.git", rev = "d3e2888c7588fe3a7be93606c7c626dbfd304d2e" }
vllm-text = { git = "https://github.com/vllm-project/vllm.git", rev = "d3e2888c7588fe3a7be93606c7c626dbfd304d2e" }
vllm-tokenizer = { git = "https://github.com/vllm-project/vllm.git", rev = "d3e2888c7588fe3a7be93606c7c626dbfd304d2e" }
xgrammar-structural-tag = { version = "0.2.0" }

[dev-dependencies]
anyhow = { version = "1.0.100" }
bytes = { version = "1.12.0" }
clap = { version = "4.5.38", features = ["derive", "env"] }
expect-test = { version = "1.5.1" }
ndarray = { version = "0.17", features = ["serde"] }
paste = { version = "1.0.15" }
rmp-serde = { version = "1.3.1" }
serial_test = { version = "3.2.0", features = ["file_locks"] }
tempfile = { version = "3.23.0" }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.22.0", features = ["v4"] }
vllm-engine-core-client = { git = "https://github.com/vllm-project/vllm.git", rev = "d3e2888c7588fe3a7be93606c7c626dbfd304d2e", features = ["test-util"] }
vllm-tokenizer = { git = "https://github.com/vllm-project/vllm.git", rev = "d3e2888c7588fe3a7be93606c7c626dbfd304d2e", features = ["test-utils"] }
zeromq = { version = "0.6.0", default-features = false, features = ["tokio-runtime", "all-transport"] }
