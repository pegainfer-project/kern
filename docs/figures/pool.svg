<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="960" height="476" fill="#ffffff"/>
<text x="32" y="42" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">A and B share a prompt prefix</text>
<text x="32" y="64" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">What kern-pool does with their KV memory, in three steps.</text>
<rect x="32" y="84" width="16" height="16" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
<text x="54" y="97" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">written by its lease</text>
<rect x="214" y="84" width="16" height="16" rx="4" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
<text x="236" y="97" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">frozen: read-only, shareable</text>
<rect x="452" y="84" width="16" height="16" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="474" y="97" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">leased, still empty</text>
<text x="32" y="184" font-size="38" font-weight="700" fill="#94a3b8" text-anchor="start">1</text>
<text x="76" y="161" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">lease</text>
<text x="76" y="181" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">A takes pages for its worst case</text>
<text x="76" y="198" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">plus one slot, all or nothing.</text>
<text x="428" y="173" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end" letter-spacing="1.2">LEASE A</text>
<text x="32" y="292" font-size="38" font-weight="700" fill="#94a3b8" text-anchor="start">2</text>
<text x="76" y="269" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">retire</text>
<text x="76" y="289" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">A ends inside p3. Nothing moves:</text>
<text x="76" y="306" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">its pages freeze where they are.</text>
<text x="428" y="281" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end" letter-spacing="1.2">CHECKPOINT</text>
<text x="32" y="400" font-size="38" font-weight="700" fill="#94a3b8" text-anchor="start">3</text>
<text x="76" y="377" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">restore</text>
<text x="76" y="397" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">B starts at the end of A's prefix</text>
<text x="76" y="414" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">and keeps writing after it.</text>
<text x="428" y="389" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end" letter-spacing="1.2">LEASE B</text>
<path d="M444,140 V136 H504 V140" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="444" y="128" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">a page = 784 tokens of KV</text>
