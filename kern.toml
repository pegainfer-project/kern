# kern.toml — what the manifest cannot know: where things are, what to
# compare against. Targets are names you pick; kern does not read meaning
# into them. Paths are relative to this file. See crates/kern-run/src/config.rs.
# `weights` entries are Hugging Face snapshot directories (every
# *.safetensors shard in them) or single files; the manifest's `bind` says
# which tensors go where. Under weights/ they are symlinks into the hub cache.

gpu = 0

# The repo's fixture: the mined silu impl against the hub one.
[targets.qwen3-4b]
manifest  = "examples/qwen3-4b-silu-mined.json"
reference = "examples/qwen3-4b.json"
kernels   = "kernels"
weights   = ["weights/Qwen3-4B"]
tokenizer = "weights/Qwen3-4B/tokenizer.json"

[kernels]
dumps   = ["dumped-kernels"]
sources = "tools/kernels-src"

[test]
seed = 0x5eed
decode_steps = 32
logit_ulp = 4

[run]
prompt = "The capital of France is"
steps = 32

# The same target with its DSpark draft: `kern run qwen3-4b-dspark` takes the
# manifest's widest step (7 rows, a speculative round); `--rows 1` is plain decode.
[targets.qwen3-4b-dspark]
manifest  = "examples/qwen3-4b-dspark.json"
kernels   = "kernels"
weights   = ["weights/Qwen3-4B", "weights/dspark-qwen3-4b-b7"]
tokenizer = "weights/Qwen3-4B/tokenizer.json"

# Qwen3.8-27B (hybrid GDN + attention): `kern run qwen3.8-27b`.
[targets."qwen3.8-27b"]
manifest  = "examples/qwen3.8-27b.json"
kernels   = "kernels-qwen38"
weights   = ["weights/Qwen3.8-27B"]
tokenizer = "weights/Qwen3.8-27B/tokenizer.json"

# With its DFlash2 draft: `kern run qwen3.8-27b-dflash2` (8-row rounds by default).
[targets."qwen3.8-27b-dflash2"]
manifest  = "examples/qwen3.8-27b-dflash2.json"
kernels   = "kernels-qwen38-dflash2"
weights   = ["weights/Qwen3.8-27B", "weights/Qwen3.8-27B-DFlash2"]
tokenizer = "weights/Qwen3.8-27B/tokenizer.json"
