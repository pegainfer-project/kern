[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kern-sglang"
version = "0.1.0"
description = "Run a kern manifest as an SGLang model"
requires-python = ">=3.10"
dependencies = ["kern"]

[project.entry-points."sglang.srt.plugins"]
kern = "kern_sglang:register"

[tool.setuptools]
packages = ["kern_sglang"]
