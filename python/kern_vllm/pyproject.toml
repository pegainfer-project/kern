[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kern-vllm"
version = "0.1.0"
description = "Run a kern manifest as a vLLM model"
requires-python = ">=3.10"
dependencies = ["kern"]

[project.entry-points."vllm.general_plugins"]
kern = "kern_vllm:register"

[tool.setuptools]
packages = ["kern_vllm"]
