<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="Interactive blueprint, peak device memory budget, and serving protocol inspector for kern manifests."
  />
  <meta name="theme-color" content="#ffffff" />
  <title>Manifest Studio — kern</title>
  <link rel="stylesheet" href="/src/studio/styles.css" />
</head>
<body>
  <div id="drop-overlay" class="drop-overlay hidden">
    <div class="drop-card">
      <div class="drop-icon">|&gt;</div>
      <div class="drop-title">Drop <code>manifest.json</code> to visualize</div>
      <div class="drop-sub">Parsed and laid out locally in your browser</div>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="/" title="Back to Kern home">
        <span class="brand-square" aria-hidden="true"></span>
        <div class="brand-text">
          <span class="brand-name">kern</span>
          <span class="brand-sub">MANIFEST STUDIO</span>
        </div>
      </a>

      <div class="divider-v"></div>

      <div class="manifest-picker-wrap">
        <span class="micro-label">MANIFEST</span>
        <span id="artifact-name" class="artifact-pill mono" title="Currently loaded manifest">qwen3.8-27b-dflash2.json</span>
        <button id="reset-example-btn" class="btn-ghost hidden" title="Switch back to built-in Qwen3.8-27B example">
          <span>Reset Example</span>
        </button>
        <button id="upload-btn" class="btn-ghost" title="Open a local manifest.json file (or drag and drop anywhere)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span>Load JSON</span>
        </button>
        <input id="file-input" type="file" accept=".json,application/json" hidden />
      </div>
    </div>

    <nav class="view-tabs" role="tablist" aria-label="Studio Views">
      <button class="view-tab active" data-view="graph" role="tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="18" r="3"/>
          <path d="M8.5 7.5L10.8 15.3M15.5 7.5L13.2 15.3"/>
        </svg>
        <span>Dataflow Blueprint</span>
      </button>
      <button class="view-tab" data-view="memory" role="tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M7 15v-4M12 15V9M17 15v-6"/>
        </svg>
        <span>Memory &amp; Peak</span>
      </button>
      <button class="view-tab" data-view="protocol" role="tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </svg>
        <span>Protocol &amp; Ops</span>
      </button>
    </nav>

    <div class="topbar-right">
      <div id="vars-bar" class="vars-bar" title="Live runtime scalar bounds — drag to evaluate shapes, byte sizes, launch grids, and `when` conditions"></div>
      <div class="divider-v"></div>
      <div id="artifact-badges" class="artifact-badges"></div>
      <button id="theme-btn" class="btn-ghost" title="Switch Theme: Paper / Dusk / Ink [T]">
        <span id="theme-swatch" class="theme-swatch"></span>
        <span id="theme-label">Paper</span>
      </button>
    </div>
  </header>

  <!-- ==================== VIEW 1: DATAFLOW BLUEPRINT ==================== -->
  <main id="view-graph" class="studio-main active">
    <aside id="left-sidebar" class="sidebar-left">
      <div class="sidebar-section programs-section">
        <div class="section-header">
          <span class="section-title">PROGRAMS</span>
          <span id="program-count-badge" class="pill-count">0</span>
        </div>
        <div id="program-list" class="program-list"></div>
      </div>

      <div class="sidebar-subtabs">
        <button class="subtab active" data-subtab="stages">Stages &amp; Layers</button>
        <button class="subtab" data-subtab="buffers">Buffers &amp; States</button>
      </div>

      <div id="subtab-stages" class="sidebar-scroll active">
        <div class="scope-mode-bar">
          <button class="scope-btn active" data-scope="macro" title="End-to-end architecture pipeline with inline expandable stages">Macro Pipeline</button>
          <button class="scope-btn" data-scope="stage" title="Deep SSA tensor-and-op blueprint for a selected stage">Stage Focus</button>
          <button class="scope-btn" data-scope="slice" title="Contiguous call-index window">Call Slice</button>
        </div>
        <div id="slice-controls" class="slice-controls hidden">
          <label>Calls <input id="slice-start" type="number" min="0" value="0" /> – <input id="slice-end" type="number" min="1" value="30" /></label>
          <button id="slice-apply" class="btn-mini">Apply</button>
        </div>
        <div class="stage-filter-wrap">
          <input id="stage-filter" type="search" placeholder="Filter stages (e.g. draft, l3)…" autocomplete="off" />
        </div>
        <div id="stage-list" class="stage-list"></div>
      </div>

      <div id="subtab-buffers" class="sidebar-scroll">
        <div class="stage-filter-wrap">
          <input id="buffer-filter" type="search" placeholder="Filter buffers / states / dtype…" autocomplete="off" />
        </div>
        <div id="buffer-kind-pills" class="kind-filter-pills"></div>
        <div id="sidebar-buffer-list" class="buffer-list"></div>
      </div>
    </aside>

    <section class="canvas-stage">
      <div class="canvas-hud-top">
        <div class="hud-group search-group">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="canvas-search" type="search" placeholder="Search op, buffer, module… [/]" autocomplete="off" />
        </div>

        <div id="stage-breadcrumb" class="hud-group breadcrumb-group hidden"></div>

        <div class="hud-group toggles-group">
          <button id="tog-buffers" class="hud-toggle" title="Expand intermediate tensors as standalone Buffer nodes (when off, tensor shapes ride directly on wires)">
            <span class="dot dot-buf"></span>Tensor Nodes
          </button>
          <button id="tog-states" class="hud-toggle active" title="Show persistent VMM State slices (kv, gdn, …)">
            <span class="dot dot-state"></span>States
          </button>
          <button id="tog-inputs" class="hud-toggle active" title="Show Program Input &amp; Peer nodes">
            <span class="dot dot-in"></span>Inputs
          </button>
          <button id="tog-weights" class="hud-toggle" title="Expand Weight buffers as standalone graph nodes (otherwise shown as compact pins on Op cards)">
            <span class="dot dot-weight"></span>Weights
          </button>
          <button id="tog-fold" class="hud-toggle active" title="Fold consecutive structurally identical stages into ×N stacks in Macro mode">
            <span>×N Fold</span>
          </button>
        </div>

        <div class="hud-group">
          <button id="orient-btn" class="hud-toggle" title="Switch layout flow direction (Top→Bottom vs Left→Right)">
            <span id="orient-label">↓ TB</span>
          </button>
          <select id="trace-mode" class="hud-select" title="Click-highlight connectivity cone">
            <option value="both">Trace: ⇅ Cone</option>
            <option value="up">Trace: ↑ Producers</option>
            <option value="down">Trace: ↓ Consumers</option>
            <option value="single">Trace: ● Node</option>
          </select>
        </div>
      </div>

      <div id="canvas-wrap" class="canvas-wrap">
        <svg id="blueprint-svg" class="blueprint-svg">
          <defs>
            <marker id="arrow-default" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="var(--edge-default)"/>
            </marker>
            <marker id="arrow-residual" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="var(--edge-residual)"/>
            </marker>
            <marker id="arrow-state" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="var(--kind-state)"/>
            </marker>
            <marker id="arrow-up" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="var(--trace-up)"/>
            </marker>
            <marker id="arrow-down" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="var(--trace-down)"/>
            </marker>
          </defs>
          <g id="viewport-g"></g>
        </svg>
      </div>

      <div class="canvas-hud-bottom-left">
        <div class="legend-pills">
          <span class="leg-item"><i style="background:var(--cat-gemm)"></i>Linear / GEMM</span>
          <span class="leg-item"><i style="background:var(--cat-attn)"></i>Attn / SSM</span>
          <span class="leg-item"><i style="background:var(--cat-norm)"></i>Norm / Act</span>
          <span class="leg-item"><i style="background:var(--cat-plan)"></i>Plan / Route</span>
          <span class="leg-item"><i style="background:var(--kind-state)"></i>VMM State</span>
          <span class="leg-item"><i style="background:var(--edge-residual)"></i>Residual Spine</span>
        </div>
        <div id="graph-telemetry" class="telemetry-text">Loading manifest…</div>
      </div>

      <div class="canvas-hud-bottom-right">
        <div id="minimap-wrap" class="minimap-wrap" title="Click or drag to navigate">
          <svg id="minimap-svg" class="minimap-svg"></svg>
        </div>
        <div class="zoom-bar">
          <button id="zoom-out" class="zoom-btn" title="Zoom Out">−</button>
          <span id="zoom-readout" class="zoom-readout">100%</span>
          <button id="zoom-in" class="zoom-btn" title="Zoom In">+</button>
          <button id="zoom-fit" class="zoom-btn fit-btn" title="Fit Graph to Screen [F]">Fit</button>
        </div>
      </div>
    </section>

    <aside id="inspector-drawer" class="sidebar-right">
      <div id="inspector-content" class="inspector-content"></div>
    </aside>
  </main>

  <!-- ==================== VIEW 2: MEMORY & PEAK ==================== -->
  <main id="view-memory" class="studio-alt-view">
    <div id="memory-dashboard" class="dashboard-container"></div>
  </main>

  <!-- ==================== VIEW 3: PROTOCOL & OPS ==================== -->
  <main id="view-protocol" class="studio-alt-view">
    <div id="protocol-dashboard" class="dashboard-container"></div>
  </main>

  <script type="module" src="/src/studio/app.js"></script>
</body>
</html>
